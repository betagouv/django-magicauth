softwareType: library
description:
  en:
    shortDescription: "Password-less authentication for Django. An email with a magic link allows a secure login."
    longDescription: >
      Django Magicauth brings password-less authentication to Django projects.
      Users enter their email address and receive an email containing a
      one-time link. Clicking the link logs them in without any password.
      The library supports optional Two-Factor Authentication (2FA) using
      One Time Passwords (OTP) via django-otp. It is designed to be easy to
      integrate into any Django project and ships with default templates that
      can be customised.
    features:
      - Password-less login via magic link sent by email
      - Optional Two-Factor Authentication (OTP) support
      - Customisable email templates
